name: seneca-s3-store

# S3 compatible server for the tests. The minio/minio image is no longer
# published on Docker Hub, so the tests use Adobe S3Mock, which implements
# the S3 API calls this plugin makes and creates the test bucket on start.
services:
  s3:
    image: adobe/s3mock:5.2
    container_name: seneca-s3-store-s3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: test-bucket
    ports:
      - '19100:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:9090/']
      interval: 5s
      timeout: 5s
      retries: 20
